# Experiment branches of the fork only (exp/*): a copy of ubuntu.yml on an ARM runner (char is unsigned there)
# and on x86-64, and a build with AddressSanitizer and UndefinedBehaviorSanitizer, which runs the map checksum
# tests and a local probe (tests/tests/game/b1probe.cpp) for short map files and big sizes in the header.
name: exp-b1

on:
  workflow_dispatch:
  push:
    branches:
      - 'exp/**'

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: apt-get update
      run: sudo apt-get update

    - name: install dependencies
      run: |
        sudo apt-get install libsdl2-dev libsdl2-mixer-dev libsdl2-net-dev libogg-dev libvorbis-dev libvorbisenc2 libvorbisidec-dev

    - name: platform
      run: |
        uname -m
        cmake --version
        c++ --version
        echo "::notice title=platform ${{ matrix.os }}::$(uname -m), $(c++ --version | head -1), char is $(echo | c++ -dM -E - | grep -q __CHAR_UNSIGNED__ && echo unsigned || echo signed)"

    - name: build
      run: |
        mkdir build && cd build
        cmake .. -DBUILD_TESTING=1
        make maxr_dedicatedserver maxr maxr_tests resinstaller -j4

    - name: test
      run: |
        cd build
        set +e
        ctest --output-on-failure > ctest.log 2>&1
        rc1=$?
        ./maxr_tests > tests.log 2>&1
        rc2=$?
        cat ctest.log tests.log
        grep -E "tests passed|tests failed" ctest.log | sed 's/^/::notice title=ctest ${{ matrix.os }}::/'
        grep -E "^\[doctest\] (test cases|assertions)" tests.log | sed 's/^/::notice title=maxr_tests ${{ matrix.os }}::/'
        grep -E ": ERROR: |SIGSEGV|CRASHED" tests.log | sort -u | head -20 | sed 's/^/::error title=maxr_tests ${{ matrix.os }}::/'
        grep -E "^  values: " tests.log | sort -u | head -20 | sed 's/^/::error title=values ${{ matrix.os }}::/'
        [ $rc1 -eq 0 ] && [ $rc2 -eq 0 ]

  sanitizers:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: apt-get update
      run: sudo apt-get update

    - name: install dependencies
      run: |
        sudo apt-get install libsdl2-dev libsdl2-mixer-dev libsdl2-net-dev libogg-dev libvorbis-dev libvorbisenc2 libvorbisidec-dev

    - name: build with AddressSanitizer and UndefinedBehaviorSanitizer
      run: |
        mkdir build && cd build
        cmake .. -DBUILD_TESTING=1 -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
        make maxr_tests -j4

    - name: test
      run: |
        cd build
        set +e
        export ASAN_OPTIONS=detect_leaks=0
        export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
        for n in 0 1 2 3 4 5 6 7 8; do
          B1_LENGTH=$n ./maxr_tests -tc=B1ProbeShortFile > probe_length_$n.log 2>&1
          rc=$?
          echo "::notice title=sanitizers: file of $n bytes, exit code $rc::$(grep -m1 -E 'ERROR: AddressSanitizer|runtime error|SIGSEGV|checksum ' probe_length_$n.log)"
        done
        for s in 300 26755 37838 53510 65535; do
          B1_SIZE=$s ./maxr_tests -tc=B1ProbeBigSize > probe_size_$s.log 2>&1
          rc=$?
          echo "::notice title=sanitizers: header size $s, exit code $rc::$(grep -m1 -E 'ERROR: AddressSanitizer|runtime error|SIGSEGV|checksum ' probe_size_$s.log)"
        done
        ./maxr_tests -tc="MapCheckSum*" > tests.log 2>&1
        rc=$?
        for f in probe_*.log tests.log; do echo "===== $f"; cat $f; done
        grep -E "^\[doctest\] (test cases|assertions)" tests.log | sed 's/^/::notice title=sanitizers MapCheckSum*::/'
        [ $rc -eq 0 ]
